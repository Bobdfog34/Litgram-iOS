name: Build Litgram iOS

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    # Telegram-iOS master requires Xcode 27.1; the xcode-27 image is the only
    # GitHub-hosted macOS runner that ships it (macos-15 tops out at 16.x).
    runs-on: xcode-27
    timeout-minutes: 300

    steps:
      - name: Checkout Litgram-iOS
        uses: actions/checkout@v4

      - name: Checkout Telegram-iOS
        uses: actions/checkout@v4
        with:
          repository: TelegramMessenger/Telegram-iOS
          path: upstream
          submodules: false

      - name: Restore submodules
        run: |
          cd upstream
          # .gitmodules points at TelegramMessenger/Telegram-iOS-submodules, which
          # needs a deploy key we do not have. SubmoduleUpdateMode=checkout keeps
          # going with whatever public submodules are reachable and reports the rest.
          git -c protocol.version=2 submodule update --init --depth 1 || true
          echo "--- submodule state ---"
          git submodule status | head -50 || true
          echo "--- third-party/bazel ---"
          ls -la third-party 2>/dev/null | head -20 || true

      - name: Show Xcode
        run: |
          ls /Applications | grep -i xcode || true
          # Make sure the newest Xcode is the active one even if the image default
          # lags behind the version Make.py demands.
          newest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -n "$newest" ]; then sudo xcode-select -s "$newest"; fi
          xcodebuild -version
          python3 --version

      - name: Prepare Litgram configuration
        run: |
          set -euo pipefail
          cd upstream
          # Start from the upstream development template and override only what
          # makes this build Litgram: bundle id, product name and API credentials.
          python3 - <<'PY'
          import json, pathlib
          template = pathlib.Path("build-system/template_minimal_development_configuration.json")
          cfg = json.loads(template.read_text())
          ours = json.loads(pathlib.Path("../ios/template_litgram_configuration.json").read_text())
          cfg.update({k: v for k, v in ours.items() if v not in ("", None)})
          pathlib.Path("build-system/litgram_configuration.json").write_text(json.dumps(cfg, indent=4))
          print(json.dumps(cfg, indent=2))
          PY

      - name: Generate Xcode project (unsigned)
        run: |
          set -euo pipefail
          cd upstream
          # --xcodeManagedCodesigning is required by Make.py even for an unsigned
          # build; no signing identity is configured, so the produced IPA stays
          # unsigned and is installed via AltStore/Sideloadly.
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            generateProject \
            --configurationPath=build-system/litgram_configuration.json \
            --xcodeManagedCodesigning \
            --disableExtensions

      - name: Build IPA
        run: |
          set -euo pipefail
          cd upstream
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            --overrideXcodeVersion \
            build \
            --configurationPath=build-system/litgram_configuration.json \
            --xcodeManagedCodesigning \
            --disableExtensions \
            --buildNumber=100001 \
            --configuration=release_arm64 || true
          echo "--- artifacts ---"
          find build -name '*.ipa' -maxdepth 4 2>/dev/null || true
          ls -la build/artifacts 2>/dev/null || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: litgram-ios-unsigned
          path: |
            upstream/build/artifacts/*.ipa
            upstream/build/**/*.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: litgram-ios-build-log
          path: upstream/build/build.log
          if-no-files-found: ignore
          retention-days: 7
