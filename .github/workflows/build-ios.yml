name: Build Litgram iOS

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    # Telegram-iOS master pins Xcode 27.1; xcode-27 is the only GitHub-hosted
    # macOS image that ships it. --overrideXcodeVersion keeps Make.py from
    # refusing whatever the image reports.
    runs-on: xcode-27
    timeout-minutes: 300

    steps:
      - name: Checkout Litgram-iOS
        uses: actions/checkout@v4

      - name: Checkout Telegram-iOS
        uses: actions/checkout@v4
        with:
          repository: TelegramMessenger/Telegram-iOS
          path: upstream
          submodules: false

      - name: Restore submodules
        run: |
          cd upstream
          # .gitmodules points at TelegramMessenger/Telegram-iOS-submodules, which
          # needs a deploy key we do not have. Keep going with whatever public
          # submodules are reachable and report the rest.
          git -c protocol.version=2 submodule update --init --depth 1 || true
          echo "--- submodule state ---"
          git submodule status | head -50 || true

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          # Prefer the exact version Make.py expects; fall back to the default.
          if [ -d /Applications/Xcode_27.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app
          fi
          xcode-select -p
          xcodebuild -version
          python3 --version

      - name: Prepare Litgram configuration
        run: |
          set -euo pipefail
          cd upstream
          python3 - <<'PY'
          import json, pathlib
          template = pathlib.Path("build-system/template_minimal_development_configuration.json")
          cfg = json.loads(template.read_text())
          ours = json.loads(pathlib.Path("../ios/template_litgram_configuration.json").read_text())
          # Replace wholesale: the template ships "{! check README.md !}" style
          # placeholders, and leaving any key empty makes bazel choke on them.
          cfg.update(ours)
          pathlib.Path("build-system/litgram_configuration.json").write_text(json.dumps(cfg, indent=4))
          print(json.dumps(cfg, indent=2))
          PY

      - name: Generate Xcode project (unsigned)
        run: |
          set -euo pipefail
          cd upstream
          # --xcodeManagedCodesigning makes Make.py use XcodeManagedCodesigningSource,
          # whose aps-environment is "" — i.e. no real signing identity is needed and
          # the produced IPA stays unsigned (installed later via AltStore/Sideloadly).
          # This step also downloads/installs bazel, which the next step wraps.
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            --overrideXcodeVersion \
            generateProject \
            --configurationPath=build-system/litgram_configuration.json \
            --xcodeManagedCodesigning

      - name: Install fake signing identity
        run: |
          set -euo pipefail
          cd upstream
          # `--xcodeManagedCodesigning` leaves the app target pointing at
          # //Telegram:Telegram_local_profile, a local_provisioning_profile rule
          # that shells out to local_provisioning_profile_finder. That tool looks
          # the profile up *in the runner's keychain* by name
          # ("iOS Team Provisioning Profile: <bundle id>") and aborts the build
          # with "no provisioning profile was found named ...". Turning it off via
          # --//Telegram:disableProvisioningProfiles is not an option: rules_apple
          # refuses a device build without a provisioning_profile attribute.
          #
          # So give the runner something to find. `generate-verification-profiles`
          # is the repository's own fixture path: it imports
          # build-system/fake-codesigning/certs/SelfSigned.p12 into a temporary
          # keychain and re-signs the fake profiles with it. Installing the result
          # into the default keychain satisfies the lookup. Nothing Apple-signed
          # exists anywhere, so the produced IPA stays unsigned and is installed
          # later through Sideloadly/AltStore.
          mkdir -p build-input/verification-profiles
          python3 build-system/Make/Make.py \
            generate-verification-profiles \
            --configurationPath=build-system/litgram_configuration.json \
            --xcodeManagedCodesigning \
            --destination=build-input/verification-profiles
          echo "--- generated profiles ---"
          ls -la build-input/verification-profiles

          # The temporary keychain GenerateProfiles.py creates is deleted when it
          # exits, so repeat the import into the default keychain the finder reads.
          security create-keychain -p litgram build.keychain || true
          security default-keychain -s build.keychain
          security unlock-keychain -p litgram build.keychain
          security import build-system/fake-codesigning/certs/SelfSigned.p12 \
            -k build.keychain -P "" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k litgram build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning build.keychain

      - name: Build IPA
        run: |
          set -euo pipefail
          cd upstream
          python3 ../ios/make_unsigned_build.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            --overrideXcodeVersion \
            build \
            --configurationPath=build-system/litgram_configuration.json \
            --xcodeManagedCodesigning \
            --enableParallelSwiftmoduleGeneration \
            --buildNumber=100001 \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath="$GITHUB_WORKSPACE/artifacts"
          echo "--- artifacts ---"
          ls -la "$GITHUB_WORKSPACE/artifacts" || true

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: litgram-ios-unsigned
          path: |
            artifacts/*.ipa
            upstream/bazel-bin/Telegram/Telegram.ipa
          if-no-files-found: warn
          retention-days: 14
