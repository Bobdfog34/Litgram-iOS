name: Build Litgram iOS

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    # Telegram-iOS master pins Xcode 27.1; xcode-27 is the only GitHub-hosted
    # macOS image that ships it. --overrideXcodeVersion keeps Make.py from
    # refusing whatever the image reports.
    runs-on: xcode-27
    timeout-minutes: 300

    steps:
      - name: Checkout Litgram-iOS
        uses: actions/checkout@v4

      - name: Checkout Telegram-iOS
        uses: actions/checkout@v4
        with:
          repository: TelegramMessenger/Telegram-iOS
          path: upstream
          submodules: false

      - name: Restore submodules
        run: |
          cd upstream
          # .gitmodules points at TelegramMessenger/Telegram-iOS-submodules, which
          # needs a deploy key we do not have. Keep going with whatever public
          # submodules are reachable and report the rest.
          git -c protocol.version=2 submodule update --init --depth 1 || true
          echo "--- submodule state ---"
          git submodule status | head -50 || true

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          # Prefer the exact version Make.py expects; fall back to the default.
          if [ -d /Applications/Xcode_27.1.app ]; then
            sudo xcode-select -s /Applications/Xcode_27.1.app
          fi
          xcode-select -p
          xcodebuild -version
          python3 --version

      - name: Prepare Litgram configuration
        run: |
          set -euo pipefail
          cd upstream
          python3 - <<'PY'
          import json, pathlib
          template = pathlib.Path("build-system/template_minimal_development_configuration.json")
          cfg = json.loads(template.read_text())
          ours = json.loads(pathlib.Path("../ios/template_litgram_configuration.json").read_text())
          # Replace wholesale: the template ships "{! check README.md !}" style
          # placeholders, and leaving any key empty makes bazel choke on them.
          cfg.update(ours)
          pathlib.Path("build-system/litgram_configuration.json").write_text(json.dumps(cfg, indent=4))
          print(json.dumps(cfg, indent=2))
          PY

      - name: Install fake provisioning profiles
        run: |
          set -euo pipefail
          cd upstream
          # Must run BEFORE generateProject. rules_apple's
          # `provisioning_profile_repository` symlinks
          #   ~/Library/MobileDevice/Provisioning Profiles
          # into bazel's external repo at creation time, and only files present at
          # that moment are visible to local_provisioning_profile_finder. Installing
          # the profiles afterwards, as an earlier attempt did, had no effect.
          #
          # The finder matches on the profile's Name ("iOS Team Provisioning
          # Profile: <bundle id>") and TeamIdentifier. The repository ships fixtures
          # and a self-signed certificate for exactly this: installing them satisfies
          # the lookup without any Apple-signed material, so the IPA stays unsigned.
          python3 ../ios/install_fake_profiles.py

      - name: Generate Xcode project (unsigned)
        run: |
          set -euo pipefail
          cd upstream
          # --xcodeManagedCodesigning makes Make.py use XcodeManagedCodesigningSource,
          # whose aps-environment is "" — i.e. no real signing identity is needed and
          # the produced IPA stays unsigned (installed later via AltStore/Sideloadly).
          # This step also downloads/installs bazel, which the next step wraps.
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            --overrideXcodeVersion \
            generateProject \
            --configurationPath=build-system/litgram_configuration.json \
            --xcodeManagedCodesigning

      - name: Install fake signing identity
        run: |
          set -euo pipefail
          cd upstream
          # The profiles installed above must not be lost to a bazel repo refresh;
          # re-assert them and drop any cached copy of the external repository so
          # local_provisioning_profile_finder sees the full set.
          python3 ../ios/install_fake_profiles.py
          bazel_cmd="$(ls build-input/bazel-* 2>/dev/null | head -1)"
          if [ -n "$bazel_cmd" ]; then
            "$bazel_cmd" shutdown || true
          fi
          ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" || true

      - name: Build IPA
        run: |
          set -euo pipefail
          cd upstream
          python3 ../ios/make_unsigned_build.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            --overrideXcodeVersion \
            build \
            --configurationPath=build-system/litgram_configuration.json \
            --xcodeManagedCodesigning \
            --enableParallelSwiftmoduleGeneration \
            --buildNumber=100001 \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath="$GITHUB_WORKSPACE/artifacts"
          echo "--- artifacts ---"
          ls -la "$GITHUB_WORKSPACE/artifacts" || true

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: litgram-ios-unsigned
          path: |
            artifacts/*.ipa
            upstream/bazel-bin/Telegram/Telegram.ipa
          if-no-files-found: warn
          retention-days: 14
